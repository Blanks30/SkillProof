databases:
  - name: skillproof-postgres
    databaseName: skillproof
    user: skillproof_user
    plan: free
    region: oregon

services:
  - type: web
    name: skillproof
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma migrate deploy && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: skillproof-postgres
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "80002"
      - key: NEXT_PUBLIC_NETWORK_NAME
        value: "Polygon Amoy Testnet"
      - key: NEXT_PUBLIC_RPC_URL
        value: "https://rpc-amoy.polygon.technology"
      - key: NEXT_PUBLIC_CONTRACT_ADDRESS
        value: "0x71C8F7A853245B11C194f48A141d6D33a0E821Db"
      - key: NEXT_PUBLIC_BLOCK_EXPLORER
        value: "https://amoy.polygonscan.com"
